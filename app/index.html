    <!-- Axeptio - Cookie Consent Manager -->
    <script>
      window.axeptioSettings = {
        clientId: "69258fdf3c6a01aba542b14e",
        cookiesVersion: "0e488f5d-2657-4f21-a75b-4534c5b002ae",
        googleConsentMode: {
          default: {
            analytics_storage: "denied",
            ad_storage: "denied",

        }

      (function(d, s) {
        var t = d.getElementsByTagName(s)[0], e = d.createElement(s);

        t.parentNode.insertBefore(e, t);

    <!-- Trackers loaded conditionally after consent -->
    <script>
      // Function to load trackers based on consent
      function loadTrackers(consent) {
        // Load Google Tag Manager if analytics cookies are accepted
        if (consent && (consent.googleAnalytics || consent.analytics || consent['google-analytics'])) {
          if (!window.dataLayer) {
            window.dataLayer = window.dataLayer || [];
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer','GTM-5CJ9TVMC');
          }

          // Load Rybbit analytics after consent
          if (!document.querySelector('script[src*="rybbit.io"]')) {
            var rybbitScript = document.createElement('script');
            rybbitScript.src = 'https://app.rybbit.io/api/script.js';
            rybbitScript.dataset.siteId = '6087b9e8663f';
            rybbitScript.defer = true;
            document.head.appendChild(rybbitScript);
          }
        }

        // Load Lemlist Tracker if marketing cookies are accepted
        if (consent && (consent.facebookPixel || consent.marketing || consent['facebook-pixel'])) {
          if (!document.querySelector('script[src*="lemlist.com"]')) {
            var lemlistScript = document.createElement('script');
            lemlistScript.type = 'text/javascript';
            lemlistScript.src = 'https://app.lemlist.com/api/visitors/tracking?k=5DEW4OaUcqqz8kENmAFQmeCHYqY79janrPKqd%2BNRpJQ%3D&t=tea_KjPPCh7XLanbviEJv';
            document.head.appendChild(lemlistScript);
          }
        }
      }

      // Wait for Axeptio to be ready
      window.addEventListener('axeptio:ready', function() {
        // Load trackers when consent is given
        window.axeptioSDK.on('consent:complete', function(consent) {
          loadTrackers(consent);
        });
        
        // Also check if consent was already given (page reload)
        window.axeptioSDK.getConsent().then(function(consent) {
          if (consent) {
            loadTrackers(consent);
          }
        });
      });
    </script>
